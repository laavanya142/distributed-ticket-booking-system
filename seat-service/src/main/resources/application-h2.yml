spring:
  datasource:
    url: jdbc:h2:mem:seat_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379

seat:
  lock:
    ttl-seconds: 600
    cleanup-cron: "0 * * * * *"

logging:
  level:
    com.ticketbooking.seat: DEBUG
